[package]
name = "dim-xf-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Synthetic multi-instance desktop application fixture for cross-platform reliability, process lifecycle, OS file locking, and fault-injection testing"

[lib]
name = "dim_xf_fixture"
path = "src/lib.rs"

[[bin]]
name = "xf-desktop-fixture"
path = "src/main.rs"

[dependencies]
dim-core = { path = "../../crates/core", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.14"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]

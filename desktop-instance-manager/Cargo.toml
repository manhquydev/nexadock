[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/profile-store",
    "crates/process-manager",
    "crates/platform-windows",
    "crates/platform-macos",
    "crates/platform-linux",
    "fixtures/test-desktop-app",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
authors = ["MultiZaloDesktop Contributors"]
repository = "https://github.com/local/desktop-instance-manager"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
libc = "0.2"
tempfile = "3.14"

dim-core = { path = "crates/core" }
dim-profile-store = { path = "crates/profile-store" }
dim-process-manager = { path = "crates/process-manager" }
dim-platform-windows = { path = "crates/platform-windows" }
dim-platform-macos = { path = "crates/platform-macos" }
dim-platform-linux = { path = "crates/platform-linux" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

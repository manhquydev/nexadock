[package]
name = "dim-desktop"
version = "0.1.1-beta.1"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Tauri 2 desktop shell for NexaDock (Independent Account Workspace)"
publish = false

[package.metadata.packaging]
tauri-cli = "2.12.5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
wry = "0.57"
url = "2"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dim-core = { path = "../../../crates/core", version = "0.1.0" }
dim-profile-store = { path = "../../../crates/profile-store", version = "0.1.0" }
dim-process-manager = { path = "../../../crates/process-manager", version = "0.1.0" }

[target.'cfg(target_os = "windows")'.dependencies]
dim-platform-windows = { path = "../../../crates/platform-windows", version = "0.1.0" }
winreg = "0.56"
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
dim-platform-macos = { path = "../../../crates/platform-macos", version = "0.1.0" }

[target.'cfg(all(not(target_os = "windows"), not(target_os = "macos")))'.dependencies]
dim-platform-linux = { path = "../../../crates/platform-linux", version = "0.1.0" }

[workspace]


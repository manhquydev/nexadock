name: NexaDock CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: desktop-instance-manager

jobs:
  rust-workspace:
    name: Rust fmt, check, clippy, and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-instance-manager/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop-instance-manager/**/Cargo.toml', 'desktop-instance-manager/Cargo.lock', 'desktop-instance-manager/apps/desktop/src-tauri/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Type-check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Compile workspace test binaries
        timeout-minutes: 10
        run: cargo test --workspace --all-targets --locked --no-run

      - name: Run core, profile-store, process-manager & fixture unit tests
        timeout-minutes: 5
        run: cargo test -p dim-core -p dim-profile-store -p dim-process-manager -p dim-test-fixture --all-targets --locked -- --test-threads=1

      - name: Run platform adapter unit & integration tests
        timeout-minutes: 8
        run: cargo test -p dim-platform-windows -p dim-platform-macos -p dim-platform-linux --all-targets --locked -- --test-threads=1

      - name: Format-check cross-platform harness
        working-directory: .
        run: cargo fmt --manifest-path desktop-instance-manager/tests/cross-platform/Cargo.toml -- --check

      - name: Clippy cross-platform harness
        working-directory: .
        run: cargo clippy --manifest-path desktop-instance-manager/tests/cross-platform/Cargo.toml --all-targets --locked -- -D warnings

      - name: Check cross-platform harness
        working-directory: .
        run: cargo check --manifest-path desktop-instance-manager/tests/cross-platform/Cargo.toml --all-targets --locked

      - name: Build dim-cli and xf-desktop-fixture for cross-platform harness
        run: |
          cargo build --bin dim-cli --locked
          cargo build --manifest-path fixtures/cross-platform/Cargo.toml --bin xf-desktop-fixture --locked

      - name: Test cross-platform harness
        timeout-minutes: 5
        working-directory: .
        run: cargo test --manifest-path desktop-instance-manager/tests/cross-platform/Cargo.toml --locked -- --test-threads=1

  cargo-deny:
    name: Dependency licenses & security advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run cargo-deny check (workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: desktop-instance-manager/Cargo.toml
          arguments: --all-features --locked
          command-arguments: ""

      - name: Run cargo-deny check (Tauri desktop crate)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: desktop-instance-manager/apps/desktop/src-tauri/Cargo.toml
          arguments: --all-features --locked
          command-arguments: ""

  node-and-windows-integration:
    name: Node.js, PowerShell & Rust parity tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify Node script syntax
        run: |
          node --check fixtures/test-desktop-app/fixture-app.mjs
          node --check apps/desktop/ui-server.mjs
          node --check apps/desktop/ui/app.js
          node --check tests/run-fixture-tests.mjs
          node --check tests/run-contract-parity-tests.mjs
          node --check tests/brand-release-gates.mjs
          node --check scripts/generate-build-provenance.mjs

      - name: Run brand consistency & release gates
        run: |
          node tests/brand-release-gates.mjs
          node --test tests/macos-release-gates.test.mjs

      - name: Run cross-platform fixture smoke check
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';

          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'dim-ci-'));
          execFileSync(process.execPath, ['fixtures/test-desktop-app/fixture-app.mjs', '--stay-ms=100'], {
            env: { ...process.env, APPDATA: tmp, HOME: tmp, XDG_CONFIG_HOME: tmp },
            stdio: 'inherit'
          });
          fs.rmSync(tmp, { recursive: true, force: true });
          EOF

      - name: Install Rust for Windows parity tests
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Build native dim-cli for contract parity tests
        if: runner.os == 'Windows'
        run: cargo build -p dim-test-fixture --bin dim-cli --release --locked

      - name: Run Windows PowerShell + UI integration suite
        if: runner.os == 'Windows'
        run: node tests/run-fixture-tests.mjs

      - name: Run PowerShell vs Rust contract parity suite
        if: runner.os == 'Windows'
        run: node tests/run-contract-parity-tests.mjs

      - name: Generate reproducible build provenance manifest & SBOM
        if: runner.os == 'Windows'
        run: node scripts/generate-build-provenance.mjs

  tauri-desktop-check:
    name: Tauri desktop crate check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux GTK/WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Format-check Tauri desktop crate
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check Tauri desktop crate
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Clippy Tauri desktop crate
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings

      - name: Compile Tauri desktop test binary
        timeout-minutes: 10
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-run

      - name: Run Tauri desktop unit & concurrency tests
        timeout-minutes: 5
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- --nocapture --test-threads=1

  macos-bundle-acceptance:
    name: macOS arm64 Bundle & Clean-Install Launch Acceptance (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Diagnose historical v0.1.1-beta.2 macOS DMG (root-cause evidence)
        working-directory: .
        run: |
          mkdir -p "${RUNNER_TEMP}/macos-acceptance"
          if curl -fsSL -o "${RUNNER_TEMP}/macos-acceptance/v0.1.1-beta.2.dmg" "https://github.com/manhquydev/nexadock/releases/download/v0.1.1-beta.2/NexaDock-0.1.1-beta.2-macos-arm64.dmg"; then
            node desktop-instance-manager/scripts/ci-cross-platform/macos-release-acceptance.mjs \
              --dmg "${RUNNER_TEMP}/macos-acceptance/v0.1.1-beta.2.dmg" \
              --arch arm64 \
              --mode dev-unsigned \
              --expected-version 0.1.1 \
              --skip-launch \
              --out "${RUNNER_TEMP}/macos-acceptance/v0.1.1-beta.2-diagnosis.json" || true
          else
            echo "Historical v0.1.1-beta.2 DMG not reachable; skipping baseline download"
          fi

      - name: Build Tauri macOS arm64 bundle (.dmg)
        working-directory: desktop-instance-manager/apps/desktop/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx --yes "@tauri-apps/cli@2.12.5" build --bundles dmg -- --locked

      - name: Run clean-install bundle & launch acceptance (dev-unsigned mode)
        working-directory: .
        run: |
          DMG=$(find desktop-instance-manager/apps/desktop/src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n1)
          if [ -z "${DMG}" ] || [ ! -s "${DMG}" ]; then
            echo "::error::Missing or empty .dmg bundle"
            exit 1
          fi
          node desktop-instance-manager/scripts/ci-cross-platform/macos-release-acceptance.mjs \
            --dmg "${DMG}" \
            --arch arm64 \
            --mode dev-unsigned \
            --expected-version 0.1.1 \
            --out "${RUNNER_TEMP}/macos-acceptance/pr-macos-arm64-acceptance.json"

      - name: Upload macOS acceptance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-acceptance-reports
          path: ${{ runner.temp }}/macos-acceptance/*.json
          retention-days: 7

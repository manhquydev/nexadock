name: NexaDock Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.1-beta.1)"
        required: true
        type: string
      allow_unsigned_dev_artifacts:
        description: "Allow unsigned macOS development artifact (workflow_dispatch only; NEVER production-ready)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.5"

jobs:
  prepare-release:
    name: Verify Tag & Release Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      base_version: ${{ steps.meta.outputs.base_version }}
      product_name: ${{ steps.meta.outputs.product_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      allow_unsigned_dev: ${{ steps.meta.outputs.allow_unsigned_dev }}
    steps:
      - name: Determine and validate target ref
        id: ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          FULL_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
            TARGET_REF="refs/tags/${TAG}"
          else
            TAG="${REF_NAME}"
            TARGET_REF="${FULL_REF}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag format: ${TAG}"
            exit 1
          fi
          echo "target_ref=${TARGET_REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.target_ref }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify tauri.conf.json matches tag & NexaDock brand
        id: meta
        shell: bash
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          CONF_PATH="desktop-instance-manager/apps/desktop/src-tauri/tauri.conf.json"
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).version)" "${CONF_PATH}")
          PRODUCT=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).productName)" "${CONF_PATH}")
          if [ "${PRODUCT}" != "NexaDock" ]; then
            echo "::error::Expected productName NexaDock, got ${PRODUCT}"
            exit 1
          fi
          if [ "${TAG}" != "v${VERSION}" ] && [[ "${TAG}" != "v${VERSION}-"* ]]; then
            echo "::error::Tag ${TAG} does not match tauri.conf.json base version v${VERSION}"
            exit 1
          fi
          RELEASE_VER="${TAG#v}"
          IS_PRE="false"
          if [[ "${RELEASE_VER}" == *-* ]]; then
            IS_PRE="true"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VER}" >> "$GITHUB_OUTPUT"
          echo "base_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "product_name=${PRODUCT}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.allow_unsigned_dev_artifacts }}" = "true" ]; then
            echo "allow_unsigned_dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "allow_unsigned_dev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run brand & UI contract gates
        run: |
          node --test desktop-instance-manager/apps/desktop/ui/tests/i18n.test.mjs \
            desktop-instance-manager/apps/desktop/ui/tests/ui-contracts.test.mjs \
            desktop-instance-manager/tests/brand-release-gates.mjs \
            desktop-instance-manager/tests/macos-release-gates.test.mjs

  build-ubuntu:
    name: Build Ubuntu 24.04 x64 (.deb, .AppImage)
    needs: prepare-release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          persist-credentials: false

      - name: Install Ubuntu WebKitGTK & bundling dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri Linux bundles (.deb, .AppImage)
        working-directory: desktop-instance-manager/apps/desktop/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --bundles deb,appimage -- --locked

      - name: Collect & name Ubuntu release assets
        shell: bash
        env:
          VER: ${{ needs.prepare-release.outputs.version }}
          PROD: ${{ needs.prepare-release.outputs.product_name }}
        run: |
          set -euo pipefail
          OUT="release-assets-ubuntu"
          mkdir -p "${OUT}"
          BUNDLE_DIR="desktop-instance-manager/apps/desktop/src-tauri/target/release/bundle"
          DEB=$(find "${BUNDLE_DIR}/deb" -name "*.deb" | head -n1)
          IMG=$(find "${BUNDLE_DIR}/appimage" -name "*.AppImage" | head -n1)
          if [ -z "${DEB}" ] || [ ! -s "${DEB}" ]; then
            echo "::error::Missing or empty .deb bundle"
            exit 1
          fi
          if [ -z "${IMG}" ] || [ ! -s "${IMG}" ]; then
            echo "::error::Missing or empty .AppImage bundle"
            exit 1
          fi
          cp "${DEB}" "${OUT}/${PROD}-${VER}-ubuntu24.04-amd64.deb"
          cp "${IMG}" "${OUT}/${PROD}-${VER}-linux-x86_64.AppImage"
          chmod +x "${OUT}/${PROD}-${VER}-linux-x86_64.AppImage"

      - name: Upload Ubuntu release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-ubuntu
          path: release-assets-ubuntu/
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64 (NSIS setup.exe, .msi)
    needs: prepare-release
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri Windows installers (nsis, msi)
        working-directory: desktop-instance-manager/apps/desktop/src-tauri
        run: |
          npx --yes "@tauri-apps/cli@$env:TAURI_CLI_VERSION" build --bundles nsis,msi -- --locked

      - name: Collect & name Windows release assets
        shell: pwsh
        env:
          VER: ${{ needs.prepare-release.outputs.version }}
          PROD: ${{ needs.prepare-release.outputs.product_name }}
        run: |
          $out = "release-assets-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bundleDir = "desktop-instance-manager/apps/desktop/src-tauri/target/release/bundle"
          $nsis = Get-ChildItem -Path "$bundleDir/nsis" -Filter "*.exe" | Select-Object -First 1
          $msi = Get-ChildItem -Path "$bundleDir/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $nsis -or $nsis.Length -le 0) { throw "Missing NSIS installer" }
          if (-not $msi -or $msi.Length -le 0) { throw "Missing MSI installer" }
          Copy-Item $nsis.FullName (Join-Path $out "$env:PROD-$env:VER-windows-x64-setup.exe") -Force
          Copy-Item $msi.FullName (Join-Path $out "$env:PROD-$env:VER-windows-x64.msi") -Force

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets-windows/
          if-no-files-found: error
          retention-days: 7

  build-macos-arm64:
    name: Build, Sign, Notarize & Verify macOS Apple Silicon arm64 (.dmg)
    needs: prepare-release
    runs-on: macos-15
    timeout-minutes: 40
    outputs:
      macos_signing_status: ${{ steps.sign_gate.outputs.signing_status }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Apple Developer signing & notarization gate
        id: sign_gate
        shell: bash
        env:
          ALLOW_UNSIGNED_DEV: ${{ needs.prepare-release.outputs.allow_unsigned_dev }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          MISSING=()
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            if [ -z "${!var:-}" ]; then
              MISSING+=("${var}")
            fi
          done

          if [ "${#MISSING[@]}" -eq 0 ]; then
            KEY_DIR="${RUNNER_TEMP}/apple-keys"
            mkdir -p "${KEY_DIR}"
            chmod 700 "${KEY_DIR}"
            KEY_PATH="${KEY_DIR}/AuthKey_${APPLE_API_KEY}.p8"
            if [[ "${APPLE_API_PRIVATE_KEY}" == *"-----BEGIN"* ]]; then
              printf '%s\n' "${APPLE_API_PRIVATE_KEY}" > "${KEY_PATH}"
            else
              printf '%s' "${APPLE_API_PRIVATE_KEY}" | base64 --decode > "${KEY_PATH}"
            fi
            chmod 600 "${KEY_PATH}"
            echo "signed_mode=true" >> "$GITHUB_OUTPUT"
            echo "signing_status=SIGNED_AND_NOTARIZED" >> "$GITHUB_OUTPUT"
            echo "api_key_path=${KEY_PATH}" >> "$GITHUB_OUTPUT"
          elif [ "${ALLOW_UNSIGNED_DEV}" = "true" ]; then
            echo "::warning::Apple Developer secrets missing (${MISSING[*]}). Proceeding in dev-only unsigned mode."
            echo "signed_mode=false" >> "$GITHUB_OUTPUT"
            echo "signing_status=UNSIGNED_DEVELOPMENT_ARTIFACT" >> "$GITHUB_OUTPUT"
            echo "api_key_path=" >> "$GITHUB_OUTPUT"
          else
            echo "::error::BLOCKED_BY_EXTERNAL_DEPENDENCY: Missing required Apple Developer secrets (${MISSING[*]}). Refusing to publish unsigned macOS DMG."
            exit 1
          fi

      - name: Build Tauri macOS arm64 bundle (.dmg)
        working-directory: desktop-instance-manager/apps/desktop/src-tauri
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.sign_gate.outputs.api_key_path }}
          SIGNED_MODE: ${{ steps.sign_gate.outputs.signed_mode }}
        run: |
          if [ "${SIGNED_MODE}" != "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
            export APPLE_SIGNING_IDENTITY="-"
          fi
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --bundles dmg -- --locked

      - name: Collect & name macOS arm64 release assets
        shell: bash
        env:
          VER: ${{ needs.prepare-release.outputs.version }}
          PROD: ${{ needs.prepare-release.outputs.product_name }}
        run: |
          set -euo pipefail
          OUT="release-assets-macos-arm64"
          mkdir -p "${OUT}"
          BUNDLE_DIR="desktop-instance-manager/apps/desktop/src-tauri/target/release/bundle"
          DMG=$(find "${BUNDLE_DIR}/dmg" -name "*.dmg" | head -n1)
          if [ -z "${DMG}" ] || [ ! -s "${DMG}" ]; then
            echo "::error::Missing or empty .dmg bundle"
            exit 1
          fi
          cp "${DMG}" "${OUT}/${PROD}-${VER}-macos-arm64.dmg"

      - name: Notarize & staple .dmg (production signed mode)
        if: steps.sign_gate.outputs.signed_mode == 'true'
        shell: bash
        env:
          VER: ${{ needs.prepare-release.outputs.version }}
          PROD: ${{ needs.prepare-release.outputs.product_name }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.sign_gate.outputs.api_key_path }}
        run: |
          set -euo pipefail
          DMG_OUT="release-assets-macos-arm64/${PROD}-${VER}-macos-arm64.dmg"
          if ! xcrun stapler validate "${DMG_OUT}" >/dev/null 2>&1; then
            xcrun notarytool submit "${DMG_OUT}" \
              --key "${APPLE_API_KEY_PATH}" \
              --key-id "${APPLE_API_KEY}" \
              --issuer "${APPLE_API_ISSUER}" \
              --wait
            xcrun stapler staple "${DMG_OUT}"
          fi
          xcrun stapler validate "${DMG_OUT}"

      - name: Clean up temporary Apple API key material
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/apple-keys"

      - name: Run macOS release acceptance gate
        shell: bash
        env:
          VER: ${{ needs.prepare-release.outputs.version }}
          BASE_VER: ${{ needs.prepare-release.outputs.base_version }}
          PROD: ${{ needs.prepare-release.outputs.product_name }}
          SIGNED_MODE: ${{ steps.sign_gate.outputs.signed_mode }}
        run: |
          set -euo pipefail
          DMG_OUT="release-assets-macos-arm64/${PROD}-${VER}-macos-arm64.dmg"
          ACCEPT_MODE="dev-unsigned"
          if [ "${SIGNED_MODE}" = "true" ]; then
            ACCEPT_MODE="production"
          fi
          node desktop-instance-manager/scripts/ci-cross-platform/macos-release-acceptance.mjs \
            --dmg "${DMG_OUT}" \
            --arch arm64 \
            --mode "${ACCEPT_MODE}" \
            --expected-version "${BASE_VER}" \
            --out "release-assets-macos-arm64/macos-arm64-acceptance.json"

      - name: Upload macOS arm64 release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos-arm64
          path: release-assets-macos-arm64/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish & Verify GitHub Release
    needs: [prepare-release, build-ubuntu, build-windows, build-macos-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact commit and fetch tags
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.commit_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify tag still resolves to built commit
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
          EXPECTED_SHA: ${{ needs.prepare-release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          if [ "${TAG_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Tag ${TAG} moved to ${TAG_SHA}, expected ${EXPECTED_SHA}"
            exit 1
          fi

      - name: Download all platform build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-staging
          merge-multiple: true

      - name: Verify staged assets & generate SHA256SUMS.txt + PROVENANCE.txt
        shell: bash
        env:
          VER: ${{ needs.prepare-release.outputs.version }}
          PROD: ${{ needs.prepare-release.outputs.product_name }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          COMMIT_SHA: ${{ needs.prepare-release.outputs.commit_sha }}
          MACOS_SIGNING_STATUS: ${{ needs.build-macos-arm64.outputs.macos_signing_status }}
        run: |
          set -euo pipefail
          cd dist-staging
          for expected in \
            "${PROD}-${VER}-ubuntu24.04-amd64.deb" \
            "${PROD}-${VER}-linux-x86_64.AppImage" \
            "${PROD}-${VER}-windows-x64-setup.exe" \
            "${PROD}-${VER}-windows-x64.msi" \
            "${PROD}-${VER}-macos-arm64.dmg" \
            "macos-arm64-acceptance.json"; do
            if [ ! -s "${expected}" ]; then
              echo "::error::Missing or empty staged artifact: ${expected}"
              exit 1
            fi
          done
          sha256sum * > SHA256SUMS.txt
          cat <<EOF > PROVENANCE.txt
          product=${PROD}
          version=${VER}
          tag=${TAG}
          commit=${COMMIT_SHA}
          repository=${GITHUB_REPOSITORY}
          workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          macos_arm64_signing_status=${MACOS_SIGNING_STATUS}
          windows_x64_signing_status=UNSIGNED_DEVELOPMENT_ARTIFACT
          linux_x64_signing_status=UNSIGNED_DEVELOPMENT_ARTIFACT
          EOF
          cat SHA256SUMS.txt
          cat PROVENANCE.txt

      - name: Create or update GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VER: ${{ needs.prepare-release.outputs.version }}
          PROD: ${{ needs.prepare-release.outputs.product_name }}
          IS_PRE: ${{ needs.prepare-release.outputs.is_prerelease }}
          COMMIT_SHA: ${{ needs.prepare-release.outputs.commit_sha }}
          MACOS_SIGNING_STATUS: ${{ needs.build-macos-arm64.outputs.macos_signing_status }}
        shell: bash
        run: |
          set -euo pipefail
          PRE_FLAG=""
          if [ "${IS_PRE}" = "true" ] || [ "${MACOS_SIGNING_STATUS}" != "SIGNED_AND_NOTARIZED" ]; then
            PRE_FLAG="--prerelease"
          fi
          NOTES_FILE="release-notes.md"
          cat <<EOF > "${NOTES_FILE}"
          ## ${PROD} ${TAG}

          - **Commit:** \`${COMMIT_SHA}\`
          - **Build Run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - **Supported Artifacts:** Windows x64 (\`.exe\`, \`.msi\`), macOS Apple Silicon \`arm64\` (\`.dmg\`), Ubuntu 24.04 \`x86_64\` (\`.deb\`, \`.AppImage\`). *(macOS Intel \`x86_64\` is not built in this release.)*

          ### Signing & Verification Status
          - **macOS Apple Silicon (\`arm64\`):** \`${MACOS_SIGNING_STATUS}\` (see \`macos-arm64-acceptance.json\` for bundle, Gatekeeper, and automated launch verification; physical Mac interactive GUI & live \`/Applications/Zalo.app\` multi-account login remain \`NOT_TESTED\` unless noted).
          - **Windows x64 / Linux x64:** \`UNSIGNED_DEVELOPMENT_ARTIFACT\` (no Authenticode OV/EV certificate configured).

          ### Checksums & Provenance
          See attached \`SHA256SUMS.txt\` and \`PROVENANCE.txt\`.
          EOF
          if gh release view "${TAG}" >/dev/null 2>&1; then
            EXISTING_PRE=$(gh release view "${TAG}" --json isPrerelease --jq '.isPrerelease')
            if [ "${EXISTING_PRE}" = "false" ] && [ "${MACOS_SIGNING_STATUS}" != "SIGNED_AND_NOTARIZED" ]; then
              echo "::error::Refusing to overwrite non-prerelease ${TAG} with ${MACOS_SIGNING_STATUS}"
              exit 1
            fi
            gh release upload "${TAG}" dist-staging/* --clobber
            if [ -n "${PRE_FLAG}" ]; then
              gh release edit "${TAG}" --title "${PROD} ${TAG} (Pre-release)" --notes-file "${NOTES_FILE}" --prerelease
            else
              gh release edit "${TAG}" --title "${PROD} ${TAG}" --notes-file "${NOTES_FILE}"
            fi
          else
            gh release create "${TAG}" dist-staging/* \
              --verify-tag \
              --title "${PROD} ${TAG}${PRE_FLAG:+ (Pre-release)}" \
              --notes-file "${NOTES_FILE}" \
              ${PRE_FLAG}
          fi

      - name: Post-publish Release Verification
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          VER: ${{ needs.prepare-release.outputs.version }}
          PROD: ${{ needs.prepare-release.outputs.product_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${TAG}" --json tagName,name,isPrerelease,assets --jq '{tagName, name, isPrerelease, assetCount: (.assets | length), assets: [.assets[] | {name, size}]}'
          for expected in \
            "${PROD}-${VER}-ubuntu24.04-amd64.deb" \
            "${PROD}-${VER}-linux-x86_64.AppImage" \
            "${PROD}-${VER}-windows-x64-setup.exe" \
            "${PROD}-${VER}-windows-x64.msi" \
            "${PROD}-${VER}-macos-arm64.dmg" \
            "macos-arm64-acceptance.json" \
            "SHA256SUMS.txt" \
            "PROVENANCE.txt"; do
            SIZE=$(gh release view "${TAG}" --json assets --jq ".assets[] | select(.name == \"${expected}\") | .size")
            if [ -z "${SIZE}" ] || [ "${SIZE}" -le 0 ]; then
              echo "::error::Missing or empty release asset: ${expected}"
              exit 1
            fi
            echo "Verified ${expected} (${SIZE} bytes)"
          done

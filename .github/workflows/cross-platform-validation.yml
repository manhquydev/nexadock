  artifact-verification:
    name: Cross-Platform Artifact Provenance & Policy Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - ubuntu-2404-build
      - windows-msvc-build
      - macos-arm64-build
      - macos-intel-build
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Download per-OS validation manifests
        uses: actions/download-artifact@v8
        with:
          pattern: manifest-*
          path: ${{ runner.temp }}/downloaded-manifests
          merge-multiple: false

      - name: Verify upstream job statuses, SHA-256 format, Section 7 schema, signing honesty & zero-VNG policy
        env:
          RES_UBUNTU: ${{ needs.ubuntu-2404-build.result }}
          RES_WINDOWS: ${{ needs.windows-msvc-build.result }}
          RES_MACOS_ARM64: ${{ needs.macos-arm64-build.result }}
          RES_MACOS_INTEL: ${{ needs.macos-intel-build.result }}
          INPUT_BUNDLES: ${{ inputs.bundles }}
        run: |
          mkdir -p "${RUNNER_TEMP}/downloaded-manifests" "${RUNNER_TEMP}/verified-manifests"
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';

          const results = {
            'ubuntu-2404-build': process.env.RES_UBUNTU,
            'windows-msvc-build': process.env.RES_WINDOWS,
            'macos-arm64-build': process.env.RES_MACOS_ARM64,
            'macos-intel-build': process.env.RES_MACOS_INTEL,
          };

          const failedUpstream = Object.entries(results).filter(
            ([, res]) => res === 'failure' || res === 'cancelled'
          );

          const dlRoot = path.join(process.env.RUNNER_TEMP, 'downloaded-manifests');
          const outRoot = path.join(process.env.RUNNER_TEMP, 'verified-manifests');
          const subdirs = fs.existsSync(dlRoot)
            ? fs.readdirSync(dlRoot, { withFileTypes: true }).filter((d) => d.isDirectory())
            : [];

          const anySucceeded = Object.values(results).includes('success');
          if (anySucceeded && subdirs.length === 0) {
            throw new Error('At least one OS build job succeeded, but zero manifest-* artifacts were downloaded.');
          }

          const requiredFields = [
            'name',
            'os',
            'cpu_architecture',
            'build_commit_sha',
            'rust_version',
            'tauri_version',
            'file_size_bytes',
            'sha256',
            'signing_status',
            'test_status',
            'build_log_url',
          ];

          let totalVerified = 0;
          for (const dir of subdirs) {
            const manifestPath = path.join(dlRoot, dir.name, 'artifact-manifest.json');
            const shaPath = path.join(dlRoot, dir.name, 'SHA256SUMS.txt');
            if (!fs.existsSync(manifestPath) || !fs.existsSync(shaPath)) {
              throw new Error(`Missing artifact-manifest.json or SHA256SUMS.txt in ${dir.name}`);
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const artifacts = Array.isArray(manifest.artifacts) ? manifest.artifacts : [];
            if (artifacts.length === 0) {
              throw new Error(`Zero artifacts recorded in ${manifestPath}`);
            }

            for (const entry of artifacts) {
              for (const field of requiredFields) {
                if (entry[field] === undefined || entry[field] === null || entry[field] === '') {
                  throw new Error(`Artifact ${entry.name || '<unnamed>'} in ${dir.name} missing Section 7 field: ${field}`);
                }
              }
              if (!/^[a-f0-9]{64}$/.test(String(entry.sha256))) {
                throw new Error(`Invalid SHA-256 digest on ${entry.name}: ${entry.sha256}`);
              }
              if (entry.signing_status !== 'UNSIGNED_DEVELOPMENT_ARTIFACT') {
                throw new Error(`Signing honesty violation on ${entry.name}: expected UNSIGNED_DEVELOPMENT_ARTIFACT, got ${entry.signing_status}`);
              }
              if (entry.vng_binary_embedded !== false) {
                throw new Error(`Zero-VNG binary policy violation on ${entry.name}`);
              }
              if (/^(zalo\.exe|zalo\.app|zalosetup)/i.test(String(entry.name))) {
                throw new Error(`Forbidden proprietary VNG Zalo payload detected: ${entry.name}`);
              }
              if (entry.artifact_kind === 'compiled-executable' && entry.is_installer !== false) {
                throw new Error(`Classification honesty violation: compiled executable ${entry.name} marked as installer`);
              }
              totalVerified += 1;
            }
            if (process.env.INPUT_BUNDLES === 'all' && !artifacts.some((a) => a.is_installer === true)) {
              throw new Error(`Expected installer artifact missing in ${dir.name} when bundles=all`);
            }
          }

          if (subdirs.length > 0) {
            execFileSync(
              process.execPath,
              [
                'desktop-instance-manager/scripts/ci-cross-platform/generate-artifact-manifest.mjs',
                '--merge-manifests', dlRoot,
                '--out-manifest', path.join(outRoot, 'cross-platform-artifact-manifest.json'),
                '--out-sha256', path.join(outRoot, 'SHA256SUMS.txt'),
                '--out-md', path.join(outRoot, 'cross-platform-summary.md'),
              ],
              { stdio: 'inherit' }
            );
          } else {
            fs.writeFileSync(
              path.join(outRoot, 'cross-platform-summary.md'),
              '# Cross-Platform Artifact Verification\n\nAll OS build targets were skipped by manual dispatch inputs (`0` artifacts generated).\n'
            );
          }

          const summaryMd = fs.readFileSync(path.join(outRoot, 'cross-platform-summary.md'), 'utf8');
          const jobTable = [
            '## Cross-Platform Build & Provenance Gate Summary',
            '',
            '| Job ID | Result |',
            '| :--- | :--- |',
            ...Object.entries(results).map(([j, r]) => `| \`${j}\` | \`${r}\` |`),
            '',
            `- **Verified Artifacts Across Enabled Targets:** \`${totalVerified}\``,
            '- **Signing Status Policy:** `UNSIGNED_DEVELOPMENT_ARTIFACT` (not signed, not a production release)',
            '- **VNG Binary Policy:** `0` proprietary VNG Zalo binaries downloaded or bundled',
            '- **Runtime Compatibility Disclosure:** Native manager build/fixture checks on macOS or Ubuntu 24.04 do **not** prove VNG Zalo macOS multi-instance runtime isolation or Linux Zalo client availability.',
            '',
            summaryMd,
          ].join('\n');

          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, jobTable + '\n');
          }

          if (failedUpstream.length > 0) {
            throw new Error(
              `Upstream OS build job(s) did not succeed: ${failedUpstream.map(([j, r]) => `${j}=${r}`).join(', ')}`
            );
          }
          EOF

      - name: Upload consolidated cross-platform manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-platform-artifact-manifest
          path: ${{ runner.temp }}/verified-manifests/*
          retention-days: 7
          if-no-files-found: warn

name: NexaDock Cross-Platform Build & Packaging Validation

# Manual-only native cross-platform build, runtime fixture, packaging, and Section 7 provenance workflow.
# Separated from `.github/workflows/ci.yml` (which handles push/PR source checks):
# - Trigger: `workflow_dispatch` ONLY (NO `push`, NO `pull_request`, NO `schedule` cron).
# - Native OS runners ONLY (zero cross-compilation masquerading as native runtime verification):
#     1. `ubuntu-24.04`   -> native Linux `x86_64` (`x86_64-unknown-linux-gnu`)
#     2. `windows-2022`   -> native Windows `x86_64` MSVC (`x86_64-pc-windows-msvc`)
#     3. `macos-15`       -> native Apple Silicon `arm64` (`aarch64-apple-darwin`, opt-in 10x cost guard)
#     4. `macos-15-intel` -> native Intel Mac `x86_64` (`x86_64-apple-darwin`, opt-in 10x cost guard;
#                            if unavailable on repo billing plan, job reports BLOCKED — never cross-compiled)
# - Strictly read-only `permissions: contents: read` (NO repo writes, NO GitHub Release creation).
# - Zero GitHub Actions secret references; produces `UNSIGNED_DEVELOPMENT_ARTIFACT` outputs only.
# - Zero VNG Zalo binaries downloaded, embedded, or redistributed.

on:
  workflow_dispatch:
    inputs:
      enable_ubuntu:
        description: "1. Ubuntu 24.04 LTS x64 native build, xvfb runtime fixture & .deb/.AppImage validation ($0.006/min, 1x)"
        required: false
        type: boolean
        default: true
      enable_windows:
        description: "2. Windows Server 2022 x64 MSVC native build, runtime fixture & MSI/NSIS validation ($0.010/min, ~2x)"
        required: false
        type: boolean
        default: true
      enable_macos_arm64:
        description: "3. macOS 15 Apple Silicon (arm64) native build, runtime fixture & .app/.dmg validation ($0.062/min, 10x — opt-in)"
        required: false
        type: boolean
        default: false
      enable_macos_intel:
        description: "4. macOS 15 Intel (x86_64) native build on macos-15-intel, runtime fixture & .app/.dmg ($0.062/min, 10x — opt-in)"
        required: false
        type: boolean
        default: false
      bundles:
        description: "Bundle mode for pinned @tauri-apps/cli@2.12.5 (all = build OS bundles via overlay; none = compiled binaries only)"
        required: false
        type: choice
        default: "all"
        options:
          - "all"
          - "none"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.5"

jobs:
  rust-workspace-validation:
    name: Rust Workspace & Tauri Source Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Ubuntu 24.04 WebKitGTK & Ayatana AppIndicator headers
        timeout-minutes: 20
        run: |
          sudo find /etc/apt -type f -exec sed -i -E 's|https?://[^/[:space:]]*ec2\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' {} + 2>/dev/null || true
          APT_OPTS=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Options::="--force-confdef"
            -o Dpkg::Options::="--force-confold"
          )
          for attempt in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get "${APT_OPTS[@]}" update && \
               sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
                 build-essential \
                 pkg-config \
                 libssl-dev \
                 libwebkit2gtk-4.1-dev \
                 libayatana-appindicator3-dev \
                 librsvg2-dev \
                 patchelf; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and check artifacts (lockfile-keyed, zero secrets)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-instance-manager/target/
            desktop-instance-manager/apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-xplat-check-${{ hashFiles('desktop-instance-manager/**/Cargo.toml', 'desktop-instance-manager/Cargo.lock', 'desktop-instance-manager/apps/desktop/src-tauri/Cargo.lock') }}

      - name: Check formatting (workspace & Tauri crate)
        working-directory: desktop-instance-manager
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Check & Clippy workspace and Tauri crate (--locked, -D warnings)
        working-directory: desktop-instance-manager
        run: |
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings

  dependency-audit:
    name: Supply-Chain, RustSec Advisory, License & Zero-VNG Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run CI tooling self-tests and static workflow validator
        run: |
          node desktop-instance-manager/scripts/ci-cross-platform/selftest.mjs
          node desktop-instance-manager/scripts/ci-cross-platform/validate-workflow.mjs

      - name: Run cargo-deny advisories, bans, licenses & sources (core workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: desktop-instance-manager/Cargo.toml
          arguments: --config desktop-instance-manager/deny.toml --all-features --locked
          command-arguments: -W wildcard advisories bans licenses sources

      - name: Run cargo-deny advisories, bans, licenses & sources (Tauri desktop crate)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: desktop-instance-manager/apps/desktop/src-tauri/Cargo.toml
          arguments: --config desktop-instance-manager/deny.toml --all-features --locked
          command-arguments: -W wildcard advisories bans licenses sources

      - name: Run cargo-deny advisories, bans, licenses & sources (C2 reliability suite)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: desktop-instance-manager/tests/cross-platform/Cargo.toml
          arguments: --config desktop-instance-manager/deny.toml --all-features --locked
          command-arguments: -W wildcard advisories bans licenses sources

      - name: Generate 7-pillar dependency & advisory audit report
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-dependency-audit"
          node desktop-instance-manager/scripts/ci-cross-platform/dependency-audit.mjs \
            --out-json "${RUNNER_TEMP}/ci-dependency-audit/dependency-audit.json" \
            --out-md "${RUNNER_TEMP}/ci-dependency-audit/dependency-audit.md"
          cat "${RUNNER_TEMP}/ci-dependency-audit/dependency-audit.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload dependency & advisory audit report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-report
          path: ${{ runner.temp }}/ci-dependency-audit/*
          retention-days: 7
          if-no-files-found: error

  ubuntu-2404-build:
    name: "1. Ubuntu 24.04 LTS x64 Native Build, Runtime Fixture & Bundle"
    needs: [rust-workspace-validation, dependency-audit]
    if: ${{ inputs.enable_ubuntu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Ubuntu 24.04 LTS Tauri, Xvfb & packaging build dependencies
        timeout-minutes: 20
        run: |
          sudo find /etc/apt -type f -exec sed -i -E 's|https?://[^/[:space:]]*ec2\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' {} + 2>/dev/null || true
          APT_OPTS=(
            -o Acquire::ForceIPv4=true
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Options::="--force-confdef"
            -o Dpkg::Options::="--force-confold"
          )
          for attempt in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get "${APT_OPTS[@]}" update && \
               sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
                 build-essential \
                 pkg-config \
                 curl \
                 wget \
                 libssl-dev \
                 libxdo-dev \
                 libwebkit2gtk-4.1-dev \
                 libayatana-appindicator3-dev \
                 librsvg2-dev \
                 patchelf \
                 file \
                 binutils \
                 dpkg-dev \
                 libfuse2t64 \
                 xdg-utils \
                 desktop-file-utils \
                 xvfb; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Install Rust stable toolchain (native x86_64-unknown-linux-gnu)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Verify native Ubuntu 24.04 x86_64 hardware and Rust host triple
        run: |
          ARCH="$(uname -m)"
          echo "Host uname -m: ${ARCH}"
          test "${ARCH}" = "x86_64"
          grep -E '^VERSION_ID="24\.04"' /etc/os-release
          RUSTC_VV="$(rustc -vV)"
          echo "${RUSTC_VV}"
          echo "${RUSTC_VV}" | grep -q '^host: x86_64-unknown-linux-gnu$'

      - name: Cache Cargo registry and Ubuntu 24.04 build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-instance-manager/target/
            desktop-instance-manager/apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-ubuntu2404-gnu-${{ hashFiles('desktop-instance-manager/**/Cargo.toml', 'desktop-instance-manager/Cargo.lock', 'desktop-instance-manager/apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install pinned @tauri-apps/cli@2.12.5 when bundling is enabled
        if: ${{ inputs.bundles != 'none' }}
        run: |
          npm install --global "@tauri-apps/cli@${TAURI_CLI_VERSION}"
          tauri --version

      - name: Check Ubuntu 24.04 LTS & WebKitGTK 4.1 prerequisites
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-ubuntu-2404"
          node desktop-instance-manager/scripts/ci-cross-platform/check-prerequisites.mjs \
            --target x86_64-unknown-linux-gnu \
            --out "${RUNNER_TEMP}/ci-ubuntu-2404/prereq.json"

      - name: Run Clippy (-D warnings, --locked) on Ubuntu 24.04 target
        working-directory: desktop-instance-manager
        run: |
          cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu --locked -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu --locked -- -D warnings

      - name: Compile, test, run runtime fixture & package Ubuntu 24.04 bundles (.deb & .AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          node desktop-instance-manager/scripts/ci-cross-platform/build-and-package.mjs \
            --target x86_64-unknown-linux-gnu \
            --bundles "${{ inputs.bundles }}" \
            --require-bundler \
            --out "${RUNNER_TEMP}/ci-ubuntu-2404/build-summary.json"

      - name: Verify native runtime fixture, Xvfb GUI startup, ELF/ldd/GLIBC & .deb/.AppImage
        run: |
          OUT_DIR="${RUNNER_TEMP}/ci-ubuntu-2404"
          BIN_PATH="desktop-instance-manager/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/dim-desktop"
          CLI_PATH="desktop-instance-manager/target/x86_64-unknown-linux-gnu/release/dim-cli"
          TMP_FIX="$(mktemp -d)"
          HOME="${TMP_FIX}" XDG_CONFIG_HOME="${TMP_FIX}" node desktop-instance-manager/fixtures/test-desktop-app/fixture-app.mjs --stay-ms=100
          HOME="${TMP_FIX}" XDG_CONFIG_HOME="${TMP_FIX}" "${CLI_PATH}" --data-dir "${TMP_FIX}/dim-data" status --json
          rm -rf "${TMP_FIX}"
          file "${BIN_PATH}"
          test -x "${BIN_PATH}"
          LDD_OUT="$(ldd "${BIN_PATH}")"
          echo "${LDD_OUT}"
          if echo "${LDD_OUT}" | grep -q "not found"; then
            echo "ERROR: Unresolved shared library in dim-desktop" >&2
            exit 1
          fi
          set +e
          timeout 3s xvfb-run -a "${BIN_PATH}" >/dev/null 2>&1
          XVFB_RC=$?
          set -e
          if [ "${XVFB_RC}" -ne 0 ] && [ "${XVFB_RC}" -ne 124 ] && [ "${XVFB_RC}" -ne 143 ]; then
            echo "ERROR: dim-desktop failed Xvfb headless startup probe with exit code ${XVFB_RC}" >&2
            exit 1
          fi
          objdump -T "${BIN_PATH}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -V | uniq | tail -n 5
          node desktop-instance-manager/scripts/ci-cross-platform/inspect-artifact.mjs \
            --file "${BIN_PATH}" \
            --out "${OUT_DIR}/inspect-dim-desktop.json"
          BUNDLE_ROOT="desktop-instance-manager/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          if [ -d "${BUNDLE_ROOT}/deb" ]; then
            for DEB in "${BUNDLE_ROOT}/deb/"*.deb; do
              [ -e "${DEB}" ] || continue
              dpkg-deb -I "${DEB}"
            done
          fi
          if [ -d "${BUNDLE_ROOT}/appimage" ]; then
            for IMG in "${BUNDLE_ROOT}/appimage/"*.AppImage; do
              [ -e "${IMG}" ] || continue
              chmod +x "${IMG}"
              ls -lh "${IMG}"
            done
          fi

      - name: Run C2 Cross-Platform Reliability Harness (Ubuntu)
        working-directory: desktop-instance-manager
        run: |
          test -f fixtures/cross-platform/Cargo.toml
          test -f tests/cross-platform/Cargo.toml
          OUT_DIR="${RUNNER_TEMP}/ci-ubuntu-2404"
          mkdir -p "${OUT_DIR}"
          export CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          C2_TMP="$(mktemp -d)"
          mkdir -p "${C2_TMP}/home" "${C2_TMP}/xdg-config"
          echo "::group::Build C2 prerequisite fixtures and run Ubuntu reliability harness"
          cargo build --manifest-path fixtures/cross-platform/Cargo.toml --release --locked
          cargo build -p dim-test-fixture --bin dim-cli --release --locked
          HOME="${C2_TMP}/home" XDG_CONFIG_HOME="${C2_TMP}/xdg-config" \
            cargo test --manifest-path tests/cross-platform/Cargo.toml --locked -- --test-threads=1
          HOME="${C2_TMP}/home" XDG_CONFIG_HOME="${C2_TMP}/xdg-config" \
            node tests/cross-platform/scripts/run-all.mjs \
              --cycles 10 \
              --metrics-runs 3 \
              --report-out "${OUT_DIR}/c2-reliability-report.json"
          HOME="${C2_TMP}/home" XDG_CONFIG_HOME="${C2_TMP}/xdg-config" \
            ./tests/cross-platform/target/release/xf-test-runner \
              --case XP-LNX-01,XP-LNX-02,XP-LNX-03,XP-LNX-04 \
              --skip-metrics \
              --require-native-os
          rm -rf "${C2_TMP}"
          echo "::endgroup::"

      - name: Stage standardized Ubuntu 24.04 release packages and generate Section 7 manifest
        run: |
          OUT_DIR="${RUNNER_TEMP}/ci-ubuntu-2404"
          BUNDLE_ROOT="desktop-instance-manager/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          REQUESTED="${{ inputs.bundles }}"
          if [ "${REQUESTED}" = "none" ]; then
            cp "desktop-instance-manager/apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/dim-desktop" "${OUT_DIR}/dim-desktop"
            cp "desktop-instance-manager/target/x86_64-unknown-linux-gnu/release/dim-cli" "${OUT_DIR}/dim-cli"
          else
            DEB_COPIED=0
            for DEB in "${BUNDLE_ROOT}/deb/"*.deb; do
              if [ -e "${DEB}" ]; then
                cp "${DEB}" "${OUT_DIR}/NexaDock-0.1.1-beta.2-ubuntu24.04-amd64.deb"
                DEB_COPIED=1
                break
              fi
            done
            if [ "${REQUESTED}" = "all" ] || echo ",${REQUESTED}," | grep -q ",deb,"; then
              if [ "${DEB_COPIED}" -ne 1 ]; then
                echo "ERROR: Expected .deb bundle missing in ${BUNDLE_ROOT}/deb" >&2
                exit 1
              fi
            fi
            IMG_COPIED=0
            for IMG in "${BUNDLE_ROOT}/appimage/"*.AppImage; do
              if [ -e "${IMG}" ]; then
                cp "${IMG}" "${OUT_DIR}/NexaDock-0.1.1-beta.2-linux-x86_64.AppImage"
                chmod +x "${OUT_DIR}/NexaDock-0.1.1-beta.2-linux-x86_64.AppImage"
                IMG_COPIED=1
                break
              fi
            done
            if [ "${REQUESTED}" = "all" ] || echo ",${REQUESTED}," | grep -q ",appimage,"; then
              if [ "${IMG_COPIED}" -ne 1 ]; then
                echo "ERROR: Expected .AppImage bundle missing in ${BUNDLE_ROOT}/appimage" >&2
                exit 1
              fi
            fi
          fi
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node desktop-instance-manager/scripts/ci-cross-platform/generate-artifact-manifest.mjs \
            --artifacts-dir "${OUT_DIR}" \
            --target x86_64-unknown-linux-gnu \
            --build-summary "${OUT_DIR}/build-summary.json" \
            --os-label ubuntu-24.04 \
            --arch x86_64 \
            --build-log-url "${LOG_URL}" \
            --out-manifest "${OUT_DIR}/artifact-manifest.json" \
            --out-sha256 "${OUT_DIR}/SHA256SUMS.txt" \
            --out-md "${OUT_DIR}/artifact-summary.md"
          cat "${OUT_DIR}/artifact-summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Ubuntu 24.04 validation manifest and reports (unsigned dev only)
        uses: actions/upload-artifact@v7
        with:
          name: manifest-ubuntu-2404-x86_64
          path: ${{ runner.temp }}/ci-ubuntu-2404/*
          retention-days: 7
          if-no-files-found: error

  windows-msvc-build:
    name: "2. Windows x64 MSVC Native Build, Runtime Fixture & Bundle"
    needs: [rust-workspace-validation, dependency-audit]
    if: ${{ inputs.enable_windows }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Rust stable toolchain (native x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Verify native Windows x86_64 hardware, MSVC linker, and Rust host triple
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE: $env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "Expected native AMD64/x86_64 host, got $env:PROCESSOR_ARCHITECTURE"
          }
          $rustcVv = (rustc -vV) -join "`n"
          Write-Host $rustcVv
          if ($rustcVv -notmatch "(?m)^host:\s*x86_64-pc-windows-msvc$") {
            throw "Expected native host x86_64-pc-windows-msvc in rustc -vV"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found; MSVC Build Tools missing"
          }
          $vcInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vcInstall) {
            throw "MSVC x86/x64 C++ tools (cl.exe/link.exe) not installed"
          }
          Write-Host "Verified MSVC installation: $vcInstall"

      - name: Cache Cargo registry and Windows MSVC build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-instance-manager/target/
            desktop-instance-manager/apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-msvc-${{ hashFiles('desktop-instance-manager/**/Cargo.toml', 'desktop-instance-manager/Cargo.lock', 'desktop-instance-manager/apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install pinned @tauri-apps/cli@2.12.5 when bundling is enabled
        if: ${{ inputs.bundles != 'none' }}
        shell: pwsh
        run: |
          npm.cmd install --global "@tauri-apps/cli@$env:TAURI_CLI_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tauri.cmd --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Windows MSVC & WiX/NSIS prerequisites
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "ci-windows-msvc"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          node desktop-instance-manager/scripts/ci-cross-platform/check-prerequisites.mjs `
            --target x86_64-pc-windows-msvc `
            --out "$outDir/prereq.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Clippy (-D warnings, --locked) on Windows x86_64-pc-windows-msvc
        working-directory: desktop-instance-manager
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile, test, run runtime fixture & package Windows bundles (MSI & NSIS)
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "ci-windows-msvc"
          node desktop-instance-manager/scripts/ci-cross-platform/build-and-package.mjs `
            --target x86_64-pc-windows-msvc `
            --bundles ${{ inputs.bundles }} `
            --require-bundler `
            --out "$outDir/build-summary.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Windows runtime fixture, PE32+ headers, XML manifest & Authenticode
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "ci-windows-msvc"
          $desktopExe = "desktop-instance-manager/apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/dim-desktop.exe"
          $cliExe = "desktop-instance-manager/target/x86_64-pc-windows-msvc/release/dim-cli.exe"
          $tmpFix = Join-Path $env:RUNNER_TEMP "dim-win-fixture-smoke"
          New-Item -ItemType Directory -Force -Path $tmpFix | Out-Null
          $env:APPDATA = $tmpFix
          $env:LOCALAPPDATA = $tmpFix
          node desktop-instance-manager/fixtures/test-desktop-app/fixture-app.mjs --stay-ms=100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cliExe --data-dir "$tmpFix\dim-data" status --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force $tmpFix -ErrorAction SilentlyContinue
          node desktop-instance-manager/scripts/ci-cross-platform/inspect-artifact.mjs `
            --file $desktopExe `
            --out "$outDir/inspect-dim-desktop.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node desktop-instance-manager/scripts/ci-cross-platform/inspect-artifact.mjs `
            --file $cliExe `
            --out "$outDir/inspect-dim-cli.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run C2 Cross-Platform Reliability Harness (Windows)
        working-directory: desktop-instance-manager
        shell: pwsh
        run: |
          if (-not (Test-Path "fixtures/cross-platform/Cargo.toml") -or -not (Test-Path "tests/cross-platform/Cargo.toml")) {
            Write-Host "::error::C2 cross-platform fixture or test manifest missing"
            exit 1
          }
          $outDir = Join-Path $env:RUNNER_TEMP "ci-windows-msvc"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $c2Tmp = Join-Path $env:RUNNER_TEMP "c2-win-sandbox"
          $prevAppData = $env:APPDATA
          $prevLocalAppData = $env:LOCALAPPDATA
          New-Item -ItemType Directory -Force -Path "$c2Tmp\appdata", "$c2Tmp\localappdata" | Out-Null
          Write-Host "::group::Build C2 prerequisite fixtures and run Windows reliability harness"
          try {
            cargo build --manifest-path fixtures/cross-platform/Cargo.toml --release --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo build -p dim-test-fixture --bin dim-cli --release --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:APPDATA = "$c2Tmp\appdata"
            $env:LOCALAPPDATA = "$c2Tmp\localappdata"
            cargo test --manifest-path tests/cross-platform/Cargo.toml --locked -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node tests/cross-platform/scripts/run-all.mjs `
              --cycles 10 `
              --metrics-runs 3 `
              --report-out "$outDir/c2-reliability-report.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "tests/cross-platform/target/release/xf-test-runner.exe" `
              --case "XP-WIN-01,XP-WIN-02,XP-WIN-03,XP-WIN-04" `
              --skip-metrics `
              --require-native-os
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:APPDATA = $prevAppData
            $env:LOCALAPPDATA = $prevLocalAppData
            Remove-Item -Recurse -Force $c2Tmp -ErrorAction SilentlyContinue
          }
          Write-Host "::endgroup::"

      - name: Stage standardized Windows release packages and generate Section 7 manifest
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "ci-windows-msvc"
          $bundleRoot = "desktop-instance-manager\apps\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $requested = "${{ inputs.bundles }}"
          if ($requested -eq "none") {
            Copy-Item "desktop-instance-manager\apps\desktop\src-tauri\target\x86_64-pc-windows-msvc\release\dim-desktop.exe" (Join-Path $outDir "dim-desktop.exe") -Force
            Copy-Item "desktop-instance-manager\target\x86_64-pc-windows-msvc\release\dim-cli.exe" (Join-Path $outDir "dim-cli.exe") -Force
          } else {
            $reqTokens = $requested.Split(',') | ForEach-Object { $_.Trim().ToLower() }
            $nsisFile = Get-ChildItem (Join-Path $bundleRoot "nsis") -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($nsisFile) {
              Copy-Item $nsisFile.FullName (Join-Path $outDir "NexaDock-0.1.1-beta.2-windows-x64-setup.exe") -Force
            } elseif ($reqTokens -contains "all" -or $reqTokens -contains "nsis") {
              Write-Error "Expected NSIS setup.exe bundle missing under $bundleRoot\nsis"
              exit 1
            }
            $msiFile = Get-ChildItem (Join-Path $bundleRoot "msi") -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($msiFile) {
              Copy-Item $msiFile.FullName (Join-Path $outDir "NexaDock-0.1.1-beta.2-windows-x64.msi") -Force
            } elseif ($reqTokens -contains "all" -or $reqTokens -contains "msi") {
              Write-Error "Expected WiX .msi bundle missing under $bundleRoot\msi"
              exit 1
            }
          }
          $logUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node desktop-instance-manager/scripts/ci-cross-platform/generate-artifact-manifest.mjs `
            --artifacts-dir "$outDir" `
            --target x86_64-pc-windows-msvc `
            --build-summary "$outDir/build-summary.json" `
            --os-label windows-2022 `
            --arch x86_64 `
            --build-log-url $logUrl `
            --out-manifest "$outDir/artifact-manifest.json" `
            --out-sha256 "$outDir/SHA256SUMS.txt" `
            --out-md "$outDir/artifact-summary.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content "$outDir/artifact-summary.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Windows validation manifest and reports (unsigned dev only)
        uses: actions/upload-artifact@v7
        with:
          name: manifest-windows-x86_64
          path: ${{ runner.temp }}/ci-windows-msvc/*
          retention-days: 7
          if-no-files-found: error

  macos-arm64-build:
    name: "3. macOS 15 Apple Silicon (arm64) Native Build, Runtime Fixture & Bundle"
    needs: [rust-workspace-validation, dependency-audit]
    if: ${{ inputs.enable_macos_arm64 }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Rust stable toolchain (native aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: clippy

      - name: Verify native Apple Silicon (arm64) hardware and Rust host triple
        run: |
          ARCH="$(uname -m)"
          echo "Host uname -m: ${ARCH}"
          sw_vers
          test "${ARCH}" = "arm64"
          RUSTC_VV="$(rustc -vV)"
          echo "${RUSTC_VV}"
          echo "${RUSTC_VV}" | grep -q '^host: aarch64-apple-darwin$'

      - name: Cache Cargo registry and macOS arm64 build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-instance-manager/target/
            desktop-instance-manager/apps/desktop/src-tauri/target/
          key: ${{ runner.os }}-aarch64-${{ hashFiles('desktop-instance-manager/**/Cargo.toml', 'desktop-instance-manager/Cargo.lock', 'desktop-instance-manager/apps/desktop/src-tauri/Cargo.lock') }}

      - name: Install pinned @tauri-apps/cli@2.12.5 when bundling is enabled
        if: ${{ inputs.bundles != 'none' }}
        run: |
          npm install --global "@tauri-apps/cli@${TAURI_CLI_VERSION}"
          tauri --version

      - name: Check macOS arm64 prerequisites (passive unsigned dev mode)
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-macos-arm64"
          node desktop-instance-manager/scripts/ci-cross-platform/check-prerequisites.mjs \
            --target aarch64-apple-darwin \
            --out "${RUNNER_TEMP}/ci-macos-arm64/prereq.json"

      - name: Run Clippy (-D warnings, --locked) on macOS aarch64-apple-darwin
        working-directory: desktop-instance-manager
        run: |
          cargo clippy --workspace --all-targets --target aarch64-apple-darwin --locked -- -D warnings
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --target aarch64-apple-darwin --locked -- -D warnings

      - name: Compile, test, run runtime fixture & package macOS arm64 (.app & .dmg)
        run: |
          node desktop-instance-manager/scripts/ci-cross-platform/build-and-package.mjs \
            --target aarch64-apple-darwin \
            --bundles "${{ inputs.bundles }}" \
            --require-bundler \
            --out "${RUNNER_TEMP}/ci-macos-arm64/build-summary.json"

      - name: Verify native arm64 runtime fixture, Mach-O headers, Info.plist & DMG
        run: |
          OUT_DIR="${RUNNER_TEMP}/ci-macos-arm64"
          BIN_PATH="desktop-instance-manager/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/dim-desktop"
          CLI_PATH="desktop-instance-manager/target/aarch64-apple-darwin/release/dim-cli"
          TMP_FIX="$(mktemp -d)"
          HOME="${TMP_FIX}" node desktop-instance-manager/fixtures/test-desktop-app/fixture-app.mjs --stay-ms=100
          HOME="${TMP_FIX}" "${CLI_PATH}" --data-dir "${TMP_FIX}/dim-data" status --json
          rm -rf "${TMP_FIX}"
          file "${BIN_PATH}"
          ARCHS="$(lipo -archs "${BIN_PATH}")"
          echo "Detected Mach-O archs: ${ARCHS}"
          test "${ARCHS}" = "arm64"
          node desktop-instance-manager/scripts/ci-cross-platform/inspect-artifact.mjs \
            --file "${BIN_PATH}" \
            --out "${OUT_DIR}/inspect-dim-desktop.json"
          BUNDLE_ROOT="desktop-instance-manager/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          if [ -d "${BUNDLE_ROOT}/macos" ]; then
            for APP in "${BUNDLE_ROOT}/macos/"*.app; do
              [ -e "${APP}" ] || continue
              plutil -lint "${APP}/Contents/Info.plist"
            done
          fi
          if [ -d "${BUNDLE_ROOT}/dmg" ]; then
            for DMG in "${BUNDLE_ROOT}/dmg/"*.dmg; do
              [ -e "${DMG}" ] || continue
              hdiutil imageinfo "${DMG}" >/dev/null
            done
          fi

      - name: Run C2 Cross-Platform Reliability Harness (macOS arm64)
        working-directory: desktop-instance-manager
        run: |
          test -f fixtures/cross-platform/Cargo.toml
          test -f tests/cross-platform/Cargo.toml
          OUT_DIR="${RUNNER_TEMP}/ci-macos-arm64"
          mkdir -p "${OUT_DIR}"
          export CARGO_HOME="${CARGO_HOME:-${HOME}/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-${HOME}/.rustup}"
          C2_TMP="$(mktemp -d)"
          mkdir -p "${C2_TMP}/home"
          echo "::group::Build C2 prerequisite fixtures and run macOS arm64 reliability harness"
          cargo build --manifest-path fixtures/cross-platform/Cargo.toml --release --locked
          cargo build -p dim-test-fixture --bin dim-cli --release --locked
          HOME="${C2_TMP}/home" \
            cargo test --manifest-path tests/cross-platform/Cargo.toml --locked -- --test-threads=1
          HOME="${C2_TMP}/home" \
            node tests/cross-platform/scripts/run-all.mjs \
              --cycles 10 \
              --metrics-runs 3 \
              --report-out "${OUT_DIR}/c2-reliability-report.json"
          HOME="${C2_TMP}/home" \
            ./tests/cross-platform/target/release/xf-test-runner \
              --case XP-MAC-01,XP-MAC-02,XP-MAC-03,XP-MAC-04 \
              --skip-metrics \
              --require-native-os
          rm -rf "${C2_TMP}"
          echo "::endgroup::"

      - name: Stage standardized macOS arm64 DMG package and generate Section 7 manifest
        run: |
          OUT_DIR="${RUNNER_TEMP}/ci-macos-arm64"
          BUNDLE_ROOT="desktop-instance-manager/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          REQUESTED="${{ inputs.bundles }}"
          if [ "${REQUESTED}" = "none" ]; then
            cp "desktop-instance-manager/apps/desktop/src-tauri/target/aarch64-apple-darwin/release/dim-desktop" "${OUT_DIR}/dim-desktop"
            cp "desktop-instance-manager/target/aarch64-apple-darwin/release/dim-cli" "${OUT_DIR}/dim-cli"
          else
            DMG_COPIED=0
            for DMG in "${BUNDLE_ROOT}/dmg/"*.dmg; do
              if [ -e "${DMG}" ]; then
                cp "${DMG}" "${OUT_DIR}/NexaDock-0.1.1-beta.2-macos-arm64.dmg"
                DMG_COPIED=1
                break
              fi
            done
            if [ "${REQUESTED}" = "all" ] || echo ",${REQUESTED}," | grep -q ",dmg,"; then
              if [ "${DMG_COPIED}" -ne 1 ]; then
                echo "ERROR: Expected macOS arm64 .dmg missing in ${BUNDLE_ROOT}/dmg" >&2
                exit 1
              fi
            fi
            if [ "${REQUESTED}" = "app" ]; then
              APP_DIR="$(ls -d "${BUNDLE_ROOT}/macos/"*.app 2>/dev/null | head -n 1 || true)"
              if [ -z "${APP_DIR}" ]; then
                echo "ERROR: Expected macOS arm64 .app missing in ${BUNDLE_ROOT}/macos" >&2
                exit 1
              fi
              cp -R "${APP_DIR}" "${OUT_DIR}/NexaDock-macos-arm64.app"
            fi
          fi
          LOG_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node desktop-instance-manager/scripts/ci-cross-platform/generate-artifact-manifest.mjs \
            --artifacts-dir "${OUT_DIR}" \
            --target aarch64-apple-darwin \
            --build-summary "${OUT_DIR}/build-summary.json" \
            --os-label macos-15 \
            --arch arm64 \
            --build-log-url "${LOG_URL}" \
            --out-manifest "${OUT_DIR}/artifact-manifest.json" \
            --out-sha256 "${OUT_DIR}/SHA256SUMS.txt" \
            --out-md "${OUT_DIR}/artifact-summary.md"
          cat "${OUT_DIR}/artifact-summary.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload macOS arm64 validation manifest and reports (unsigned dev only)
        uses: actions/upload-artifact@v7
        with:
          name: manifest-macos-arm64
          path: ${{ runner.temp }}/ci-macos-arm64/*
          retention-days: 7
          if-no-files-found: error

